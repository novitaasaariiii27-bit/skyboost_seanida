quiz:()=>{const q=Q[S.q],a=S.ans[S.q],f=fuel(),d=a!==undefined,good=a==q[2];return[`<div class="hd"><button class="ic" data-a="go:misi">←</button><b>Meteor Question Session</b><span class="chip">☆ ${S.bal}</span></div><div class="pg">${cd(`<div class="r sb"><b>▮ Bahan Bakar Kosmik</b><span class="tg">${f}% Siap</span></div><div style="margin:8px 0">${bar(f)}</div><div class="r sb"><b style="color:var(--v)">Meteor ${S.q+1} dari 10</b><span class="m">${(S.q+1)*10}% Selesai</span></div>`)}${cd(`<div class="r sb"><span class="tg v">⚡ SOAL ${String(S.q+1).padStart(2,"0")}</span><b style="color:#a86a00">☆ +25 Poin Kosmik</b></div><h2 style="margin-top:12px;line-height:1.4">${q[0]}</h2>`)}${q[1].map((o,i)=>`<div class="op ${d?(i==q[2]?"ok":i==a?"no":""):""}" ${d?"":`data-a="ans:${i}"`}><i>${d&&i==q[2]?"✓":d&&i==a?"✕":"ABCD"[i]}</i>${o}</div>`).join("")}${d?cd(`<b style="color:${good?"var(--pd)":"#ba1a1a"}">${good?"Kecepatan Navigasi Optimal!":"Hampir Tepat, Astronaut! (bahan bakar −15%)"}</b><br><span class="m">${good?"Rute orbit stabil menuju meteor berikutnya terbuka bebas hambatan.":q[3]}</span>`,"margin-top:12px")+bt(S.q==9?"Lihat Hasil Misi →":S.f<=0?"Bahan Bakar Habis →":"Lanjut Terbang ke Meteor Berikutnya →","qn"):""}</div>`]},
lambat:()=>[hd("Misi Kuis Kosmik","peta")+`<div class="pg c"><div style="width:200px;margin:14px auto 0">${I("sleep","fl")}</div><span class="tg e">Bahan Bakar 0%</span><h1>Bahan Bakar Melambat</h1><p class="m">Roketmu berhenti sementara di lintasan orbit. Baca ulang kartu belajar untuk mengisi tangki bahan bakar kembali!</p>${cd(`<div class="r sb"><b>Progres Kuis Tersimpan</b><span class="tg">${S.ans.length}/10 Terjawab</span></div><div style="margin:8px 0">${bar(S.ans.length*10)}</div><span class="m" style="font-size:12px">Poin aman &amp; tersimpan otomatis. Tidak ada game over.</span>`,"margin-top:14px;text-align:left")}${bt("Baca Kartu Belajar dan Isi Ulang ⚡","refill")}${bt("Kembali ke Peta Planet","go:peta","w")}</div>`],
hasil:()=>{const r=S.res,p=r.p;return[hd("Detail Misi","peta")+`<div class="pg c"><span class="tg ${p?"v":"e"}">Status Misi: ${p?"Berhasil":"Belum Berhasil"}</span><div style="width:180px;margin:10px auto" class="${p?"fl":""}">${I(p?"planetface":"sleep")}</div><h1>${p?"Selamat, Misi "+PL[S.mp]+" Selesai!":"Misi "+PL[S.mp]+" Belum Selesai"}</h1><p class="m">${p?"Kamu menyelesaikan seluruh pertanyaan dan membuka bonus belajar.":"Butuh akurasi minimal 60% untuk membuka planet berikutnya. Pelajari pembahasan, lalu ulangi kuis ya!"}</p>${cd(`<div class="r sb"><span class="m">Planet Misi</span><span class="tg v">Level ${S.mp+2}</span></div><h2 style="margin:8px 0;text-align:left">${PL[S.mp]}</h2><div class="r sb"><span class="m">Akurasi</span><b>${r.a}%</b></div><div class="r sb" style="margin-top:6px"><span class="m">Perolehan Bintang</span><b style="color:#d98a00">${st(r.s)} (${r.s} Bintang)</b></div><div class="r sb" style="margin-top:6px"><span class="m">Poin Kosmik</span><b>${S.pts}</b></div><div class="r sb" style="margin-top:6px"><span class="m">Hadiah Saldo</span><b>${p?(r.n?"+40 Bintang Orbit (20 × 2)":"Sudah diterima"):"Belum ada"}</b></div>`,"margin-top:14px")}${S.bn?cd("🔥 Rentetan 7 hari tercapai: bonus +50 Bintang!"):""}${bt("Lihat Hasil Kuis →","go:bahas")}<p class="m" style="font-size:12px;margin-top:8px">Berikutnya: Hasil Kuis</p></div>`]},
bahas:()=>{const b=hit(),L=Q.map((q,i)=>[q,i,S.ans[i]]).filter(x=>S.filt=="all"||(S.filt=="ok")==(x[2]==x[0][2]));return[hd("Pembahasan Kuis Meteor","hasil")+`<div class="pg"><h1 style="font-size:21px">Evaluasi &amp; Pembahasan Kuis</h1><p class="m">Tinjau hasil jawabanmu pada 10 rintangan meteor ${PL[S.mp]}</p><div class="g2" style="grid-template-columns:repeat(3,1fr);margin:12px 0">${[["Benar",b,"var(--pd)"],["Salah",10-b,"#ba1a1a"],["Akurasi",b*10+"%","var(--v)"]].map(x=>`<div class="cd c" style="margin:0;padding:12px"><span class="m">${x[0]}</span><h2 style="color:${x[2]}">${x[1]}</h2></div>`).join("")}</div><div class="r">${[["all","Semua (10)"],["bad",`Salah (${10-b})`],["ok",`Benar (${b})`]].map(f=>bt(f[1],"f:"+f[0],S.filt==f[0]?"":"s").replace("margin-top:10px","").replace('class="bt','style="margin:0 0 10px;padding:10px;font-size:12px" class="bt')).join("")}</div>${L.map(([q,i,u])=>{const g=u==q[2];return cd(`<div class="r sb"><b>Meteor #${String(i+1).padStart(2,"0")}</b><span class="tg ${g?"":"e"}">${g?"Benar (+25 Poin)":"Jawabanmu Keliru"}</span></div><p style="margin:8px 0;font-weight:700">${q[0]}</p><div class="m">Jawaban Kamu${g?" (Tepat)":""}: <b style="color:${g?"var(--pd)":"#ba1a1a"}">${"ABCD"[u]}. ${q[1][u]}</b></div>${g?"":`<div class="m">Kunci Jawaban: <b style="color:var(--pd)">${"ABCD"[q[2]]}. ${q[1][q[2]]}</b></div>`}<div style="background:#e6faf2;border-radius:14px;padding:10px;margin-top:8px"><b>Pembahasan Kosmik</b><br>${q[3]}</div>`)}).join("")}${cd(`<div class="r"><div style="width:42px;flex:none">${I("mascot")}</div><span><b>Tips Navigator Kosmik</b><br>${b==10?"Sempurna! Kamu menguasai seluruh materi orbit ini.":"Kamu menguasai "+b*10+"% materi lintasan orbit! Pelajari lagi konsep yang masih salah."}</span></div>`)}${bt("Ulangi Kuis","retry","s")}${(S.res&&S.res.p?bt("Lanjut ke Planet Baru","go:baru"):'<p class="m c" style="margin-top:8px;font-size:12px">Capai akurasi minimal 60% untuk membuka planet berikutnya.</p>')}</div>`]},
baru:()=>{const n=S.cur<4;return[hd("Detail Misi","bahas")+`<div class="pg c"><span class="tg">✨ PLANET BARU TERBUKA!</span><div style="width:250px;margin:10px auto" class="fl">${I("newplanet")}</div><h1>${n?"Selamat Datang di "+PL[S.cur]+"!":"Semua Planet Demo Selesai!"}</h1><p class="m">${n?"Pilih modul pribadimu agar roketmu terisi bahan bakar lagi.":"Planet Zeta terkunci sampai Level 5."}</p>${n?cd(`<div class="r"><b style="background:var(--p);color:#fff;border-radius:50%;width:34px;height:34px;display:grid;place-items:center">1</b><span style="text-align:left"><b>${PL[S.cur]} · Misi #04</b><br><span class="m">Siap dikonfigurasi</span></span></div>`,"margin-top:14px")+bt("Pilih Modul untuk Planet Ini →","startm"):""}${bt("Lihat Seluruh Peta Planet","go:peta","s")}</div>`]},
toko:()=>[`<div class="hd"><b>🛍️ Toko Kosmik</b><span class="chip">☆ ${S.bal}</span></div><div class="pg">${cd(`<div class="r"><div style="width:48px;flex:none">${I("mascot")}</div><span class="m">Tukar Bintang dengan kostum dan skin roket. Semua perlengkapan bersifat kosmetik tanpa efek performa.</span></div>`)}${[0,1].map(g=>`<h2 style="margin:12px 0 8px">${g?"Koleksi Skin Roket":"Koleksi Kostum Astronaut"}</h2><div class="g2">${SH.filter(x=>x[4]==g).map(x=>{const o=own(x[0]),k=x[2]>S.bal;return`<div class="cd c" style="margin:0;background:${g?"#e8ddff":"#fff"}"><div style="font-size:42px">${x[3]}</div><b style="font-size:13px">${x[1]}</b><div class="m">${o?"":"☆ "+x[2]}</div>${o?`${S.eq[g]==x[0]?'<span class="tg v">Dipakai</span>':'<span class="tg v">Sudah Dimiliki</span>'+bt("Pakai","eq:"+x[0],"s").replace('class="bt','style="padding:8px;font-size:12px" class="bt')}`:bt(g?"Beli Skin":"Beli Kostum","b:"+x[0]).replace("margin-top:10px","").replace('class="bt','style="padding:10px;font-size:12px" class="bt').replace("<button",k?"<button disabled":"<button")+(k?`<div class="er">Kurang ${x[2]-S.bal} Bintang</div>`:"")}</div>`}).join("")}</div>`).join("")}</div>`,"toko"],
cek:()=>{const x=SH.find(i=>i[0]==S.buy);return[hd("Konfirmasi Pembelian","toko")+`<div class="pg c">${cd(`<div style="font-size:90px">${x[3]}</div><h2>${x[1]}</h2><span class="tg v">☆ ${x[2]} Bintang</span>`)}${cd(`<div class="r sb"><span>Harga Item</span><b>${x[2]} Bintang</b></div><div class="r sb" style="margin:8px 0"><span>Biaya Admin</span><b>-</b></div><hr style="border:0;border-top:1px solid #eee"><div class="r sb" style="margin-top:8px"><b>Total Pembayaran</b><b>☆ ${x[2]} Bintang</b></div>`)}${bt("Konfirmasi Pembelian","pay")}<p class="m" style="font-size:12px;margin-top:10px">Pastikan item yang kamu beli sudah sesuai, ya!</p></div>`]},
sukses:()=>{const x=SH.find(i=>i[0]==S.buy);return[`<div class="pg c" style="padding-top:90px"><div style="font-size:90px" class="pu">✅</div><div style="font-size:26px">✨ ⭐ ✨</div><h1>Pembelian Berhasil!</h1><p class="m">Kamu telah membeli ${x[1]}.</p>${cd(`<div class="r"><span style="font-size:36px">${x[3]}</span><span style="text-align:left"><b>${x[1]}</b><br><span class="tg v">☆ ${x[2]} Bintang</span></span></div>`,"margin-top:20px")}${bt("OK","go:toko")}</div>`]},
profil:()=>[`<div class="hd"><span class="chip" style="background:var(--p);color:#fff">SB</span><b>SkyBoost</b>${bt("Keluar","pop:out","d").replace('class="bt','style="width:auto;margin:0;padding:9px 16px;font-size:13px;box-shadow:none" class="bt')}</div><div class="pg">${cd(`<div class="r"><div style="width:58px;flex:none">${I("mascot")}</div><span style="flex:1"><h2>${S.name}</h2><span class="m">Penjelajah Antariksa Muda</span></span><span class="chip">☆ ${S.bal}</span></div>`)}<div data-a="go:streak" style="cursor:pointer">${cd(`<div class="r sb"><b>Rentetan Belajar</b>🔥</div><div class="r sb" style="margin-top:8px;background:#e6faf2;padding:11px;border-radius:14px"><b>⚡ ${S.streak} Hari Berturut-turut</b><span class="tg">AKTIF</span></div>`)}</div>${cd(`<b>Statistik Petualangan</b><div class="g2" style="grid-template-columns:repeat(3,1fr);margin-top:10px">${[["🌐","Planet",S.cur+1],["🚩","Misi",18+S.nm],["🎯","Akurasi",S.acc+"%"]].map(x=>`<div class="c" style="background:#f0f3ff;border-radius:16px;padding:12px">${x[0]}<div class="m" style="font-size:12px">${x[1]}</div><h2>${x[2]}</h2></div>`).join("")}</div>`)}${cd(`<b>Koleksi Kustomisasi</b><div class="r" style="margin-top:10px;flex-wrap:wrap">${SH.filter(x=>own(x[0])).map(x=>`<span class="tg ${x[0]=="klasik"?"":"v"}">${x[3]} ${x[1]}</span>`).join("")}</div>`)}</div>`,"profil"],
streak:()=>[hd("Rentetan Belajar","profil")+`<div class="pg c"><div style="font-size:70px" class="fl">🔥</div><h1>${S.streak} Hari Berturut-turut!</h1><p class="m">Belajar setiap hari agar rentetan terus menyala.</p>${cd(`<div class="r sb"><b>Kalender Mingguan</b><span class="tg">${S.streak}/7 Hari</span></div><div class="r sb" style="margin-top:12px">${"Sen Sel Rab Kam Jum Sab Min".split(" ").map((d,i)=>`<div><div class="m" style="font-size:11px">${d}</div><div class="dy ${i<S.streak?"on":""}">${i<S.streak?"✓":""}</div></div>`).join("")}</div>`,"margin-top:14px")}${cd(`<h2>Rentetan Terputus? Jangan Khawatir!</h2><p class="m" style="margin:6px 0">Pulihkan dengan 10 Bintang. Saldo kamu: ${S.bal} Bintang. ${S.broken?"Rentetanmu terputus, pulihkan sekarang!":"Rentetanmu masih menyala, belum perlu dipulihkan."}</p>${S.broken?"":'<button class="bt w" data-a="brk">Uji: putuskan rentetan (demo)</button>'}<div class="r">${bt("Batal","go:profil","w")}${bt("Ya, Pulihkan","heal").replace("<button",S.bal<10||!S.broken?"<button disabled":"<button")}</div>`,"text-align:left")}${cd(`<span class="m">🏅 Target 7 hari: ${S.streak>=7?"tercapai!":"selesaikan "+(7-S.streak)+" hari lagi untuk bonus 50 Bintang."}</span>`)}</div>`]};
function R(){clearTimeout(T);clearInterval(S.iv);const[h,n]=sc[S.scr]();const x=S.pop.startsWith("b:")?SH.find(i=>i[0]==S.pop.slice(2)):0;
app.innerHTML=h+(n?nav(n):"")+(S.pop=="out"?`<div class="mk"><div class="cd c"><div style="font-size:40px">🚪</div><h2>Konfirmasi Keluar Akun?</h2><p class="m" style="margin:8px 0">Progres Misi, ${S.bal} Bintang, dan ${S.streak} hari rentetan tetap tersimpan di server. Progres cloud terakhir tersimpan 2 menit lalu.</p>${bt("Ya, Keluar Akun","out","d")}${bt("Batal dan Tetap","pop:","s")}</div></div>`:x?`<div class="mk"><div class="cd c"><div style="font-size:40px">${x[3]}</div><h2>Konfirmasi Pembelian</h2><p class="m" style="margin:8px 0">Beli ${x[1]} seharga ${x[2]} Bintang? Saldo ${S.bal} → sisa ${S.bal-x[2]} Bintang.</p><div class="r">${bt("Batal","pop:","s")}${bt("Ya, Beli","ya")}</div></div></div>`:"");
if(S.scr=="splash")T=setTimeout(()=>go("login"),2300);
if(S.scr=="ai"){S.prog=0;S.iv=setInterval(()=>{S.prog=Math.min(100,S.prog+5);if(S.prog>=100){clearInterval(S.iv);T=setTimeout(()=>{S.card=0;go("kartu")},700)}app.innerHTML=sc.ai()[0]},120)}
if(S.scr=="count"){S.cd=3;S.iv=setInterval(()=>{S.cd=Math.max(0,S.cd-1);$("#tm").textContent="T-MINUS 00:0"+S.cd;if(!S.cd)clearInterval(S.iv)},900)}}
const go=x=>{if(x=="baru"&&!(S.res&&S.res.p))x="bahas";S.scr=x;S.pop="";R();scrollTo(0,0)};
function chk(){const g=i=>$("#"+i)?.value||"";$("#bt").disabled=S.scr=="login"?!(g("em")&&g("pw")):!(g("nm")&&g("em")&&g("pw")&&g("pc")&&S.agree)}
function keep(f){const v=[...app.querySelectorAll("input.in")].map(i=>i.value);f();R();app.querySelectorAll("input.in").forEach((i,k)=>i.value=v[k]);chk()}
const A={go,x(){},eye(){keep(()=>S.pwd^=1)},agree(){S.agree^=1;chk()},
login(){const e=$("#em").value,p=$("#pw").value;$("#e1").textContent=ok(e)?"":"Format email tidak valid";$("#e2").textContent=ok(e)&&p.length<6?"Email atau kata sandi salah":"";if(ok(e)&&p.length>=6){S.name=e.split("@")[0];go("peta")}},
reg(){const e=$("#em").value,p=$("#pw").value;$("#e1").textContent=ok(e)?"":"Format email tidak valid";$("#e2").textContent=p.length<8?"Kata sandi minimal 8 karakter":p!=$("#pc").value?"Konfirmasi kata sandi tidak sama":"";if(ok(e)&&p.length>=8&&p==$("#pc").value){S.name=$("#nm").value;go("peta")}},
startm(){S.mp=S.cur;S.mod=0;go("modul")},mod(v){S.mod=+v;R()},up(){$("#fi").click()},card0(){S.card=0;go("kartu")},
prev(){S.card--;R()},next(){if(S.card==3)go("misi");else{S.card++;R();scrollTo(0,0)}},
launch(){$("#rk").classList.add("up");T=setTimeout(()=>go("meteor"),900)},
startq(){S.q=0;S.ans=[];go("quiz")},retry(){S.q=0;S.ans=[];go("misi")},
